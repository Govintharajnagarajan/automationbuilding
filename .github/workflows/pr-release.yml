name: Release from Merged PR

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create_release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next semantic version
        id: semver
        uses: phipsg/next-semver-action@v1.1
        with:
          initial-version: '1.0.0'

      - name: Generate formatted release notes
        id: generate_notes
        run: |
          # Fetch all commit messages from the PR
          COMMITS=$(git log --format=%B --no-merges --reverse ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          # Initialize the release body with a header
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "## What's Changed" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          # Categorize commit messages
          FEATS=$(echo "$COMMITS" | grep '^feat:' | sed 's/^feat:/* Feat:/')
          FIXES=$(echo "$COMMITS" | grep '^fix:' | sed 's/^fix:/* Fix:/')
          BUGS=$(echo "$COMMITS" | grep '^bug:' | sed 's/^bug:/* Bug:/')
          CHORES=$(echo "$COMMITS" | grep '^chore:' | sed 's/^chore:/* Chore:/')
          
          if [ ! -z "$FEATS" ]; then
            echo "### Features" >> $GITHUB_ENV
            echo "$FEATS" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
          fi
          if [ ! -z "$FIXES" ] || [ ! -z "$BUGS" ]; then
            echo "### Bug Fixes" >> $GITHUB_ENV
            echo "$FIXES" >> $GITHUB_ENV
            echo "$BUGS" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
          fi
          if [ ! -z "$CHORES" ]; then
            echo "### Maintenance" >> $GITHUB_ENV
            echo "$CHORES" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
          fi
          
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.semver.outputs.current_version }}...v${{ steps.semver.outputs.next_version }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create release tag
        id: create_tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.semver.outputs.next_version }}"
          name: "v${{ steps.semver.outputs.next_version }}"
          body: ${{ env.RELEASE_BODY }}
