name: Generate Release Notes from PR Commits

on:
  pull_request:
    types:
      - closed

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true # Only run if the PR is merged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get PR Title
        id: pr_title
        run: echo "PR_TITLE=$(curl -s https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} | jq -r '.title')" >> $GITHUB_ENV

      - name: Set up Git
        run: |
          git fetch --prune --unshallow

      - name: Get All Commit Messages
        id: get_commits
        run: |
          # Get all commits in the PR (not just the merge commit)
          COMMITS=$(git log --format=%s ${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA}^..${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA})
          
          # Start release notes with PR title
          RELEASE_NOTES="### Release Notes for PR: '${{ env.PR_TITLE }}' (#${{ github.event.pull_request.number }})\n\n"
          
          # Categorize commit messages and add emojis
          for commit in $COMMITS
          do
            if [[ $commit == feat* ]]; then
              RELEASE_NOTES+=":sparkles: Feature: $commit\n"
            elif [[ $commit == fix* ]]; then
              RELEASE_NOTES+=":bug: Fix: $commit\n"
            elif [[ $commit == docs* ]]; then
              RELEASE_NOTES+=":book: Docs: $commit\n"
            elif [[ $commit == chore* ]]; then
              RELEASE_NOTES+=":wrench: Chore: $commit\n"
            elif [[ $commit == refactor* ]]; then
              RELEASE_NOTES+=":recycle: Refactor: $commit\n"
            else
              RELEASE_NOTES+=":memo: Other: $commit\n"
            fi
          done

          # Set the release notes to GitHub Actions environment variable
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.pull_request.head.ref }}
          release_name: "Release - PR #${{ github.event.pull_request.number }}: ${{ env.PR_TITLE }}"
          body: ${{ env.RELEASE_NOTES }}
          draft: true
          prerelease: false

      - name: Post Release Information
        run: echo "Release draft created with notes: ${{ env.RELEASE_NOTES }}"
